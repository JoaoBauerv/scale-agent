[package]
name = "scale-agent"
version = "1.0.0"
edition = "2021"
description = "Scale Agent: agente de balança para desktop: lê a balança (serial ou simulada) e entrega o peso por HTTP ao sistema web"
rust-version = "1.80"

[dependencies]
eframe = "0.29"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serialport = "4"
regex = "1"
rand = "0.8"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
