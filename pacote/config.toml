# Configuração do Scale Agent (agente de balança).
# Prefira editar pela janela do agente (aba Configurações): ela valida
# antes de salvar. Se editar à mão, reabra o agente para aplicar.

modo_balanca = "simulada"
unidade = "kg"
host = "127.0.0.1"
porta_api = 5000
origens_permitidas = "http://localhost,http://127.0.0.1,https://web-recycle.vercel.app"
permitir_rede = false
api_token = ""
intervalo_atualizacao = 0.5
tolerancia_estabilidade = 0.05
tempo_estabilidade = 1.5
casas_decimais = 2
sim_peso_minimo = 0.0
sim_peso_maximo = 200.0
sim_peso_inicial = 0.0
sim_resolucao = 0.1
porta_com = "COM3"
baudrate = 9600
bytesize = 8
paridade = "N"
stopbits = 1
timeout = 1.0
comando_peso = ""
terminador = '\r\n'
protocolo_regex = '([-+]?\d+[.,]?\d*)'
protocolo_regex_estavel = ""
fator_divisao = 1.0
comando_zero = ""
comando_tara = ""
log_nivel = "INFO"
iniciar_com_windows = false
